name: Publish preview when credentials are configured
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment configuration
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment not configured: add a scoped Cloudflare Pages token and account ID to repository secrets. No deployment performed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Build and verify preview
        id: build
        if: steps.credentials.outputs.ready == 'true'
        run: |
          vispo_mode=$(python3 -c "import json; print(json.load(open('site-config.json')).get('mode', 'preview'))")
          if [ "$vispo_mode" != preview ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Automatic preview publication is disabled after cutover. Use the approved production deployment procedure.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/build.py
          python3 scripts/verify.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Publish preview
        if: steps.build.outputs.ready == 'true'
        run: npx --yes wrangler@4.85.0 pages deploy dist --project-name vispo-website --branch main --commit-hash "$GITHUB_SHA" --commit-message 'Publish verified VISPO preview'
